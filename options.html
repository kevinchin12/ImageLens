<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图透镜 Image Lens 设置</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero glass">
        <div>
          <p class="eyebrow">图透镜 Image Lens</p>
          <h1>填写模型配置后即可开始使用</h1>
          <p class="subtitle">当前版本采用自带密钥模式，API Key 只保存在当前浏览器本地。</p>
        </div>
      </section>

      <section class="grid">
        <form id="settings-form" class="glass card">
          <section class="field-group">
            <div class="section-head">
              <h2>提示词识别</h2>
              <p>用于分析网页图片并生成提示词。</p>
            </div>

            <label class="field">
              <span>识别图片模型 API Key</span>
              <input name="promptApiKey" type="password" placeholder="AIza..." autocomplete="off" />
              <small>只保存在本地 `chrome.storage.local`，不会写入代码仓库。</small>
            </label>

            <label class="field">
              <span>识别图片模型</span>
              <input name="promptModel" type="text" placeholder="gemini-2.5-flash" />
            </label>

            <label class="field toggle">
              <span>打开面板后自动识别</span>
              <input name="autoAnalyze" form="settings-form" type="checkbox" />
            </label>
          </section>

          <section class="field-group">
            <div class="section-head">
              <h2>生图</h2>
              <p>可选功能。关闭后，插件主界面不再显示生图区域。</p>
            </div>

            <label class="field toggle">
              <span>开启生图功能</span>
              <input name="imageGenerationEnabled" form="settings-form" type="checkbox" />
            </label>

            <div id="image-settings-group" class="field-stack">
              <label class="field">
                <span>生图模型 API Key</span>
                <input name="imageApiKey" type="password" placeholder="AIza..." autocomplete="off" />
              </label>

              <label class="field">
                <span>生图模型</span>
                <input name="imageModel" type="text" placeholder="gemini-3.1-flash-image-preview" />
                <small>不同账号、地区或套餐的可用模型可能不同。</small>
              </label>

              <details class="advanced glass-subtle">
                <summary>生图高级设置</summary>

                <div class="advanced-body">
                  <label class="field">
                    <span>默认长宽比</span>
                    <select name="aspectRatio" form="settings-form">
                      <option value="1:1">1:1</option>
                      <option value="16:9">16:9</option>
                      <option value="9:16">9:16</option>
                      <option value="4:3">4:3</option>
                      <option value="3:4">3:4</option>
                    </select>
                  </label>

                  <label class="field">
                    <span>默认出图张数</span>
                    <select name="imageCount" form="settings-form">
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                    </select>
                  </label>
                </div>
              </details>
            </div>
          </section>

          <div class="actions">
            <button class="primary" type="submit">保存设置</button>
            <button id="open-doc" type="button">查看文档</button>
          </div>
          <p class="note">提示：这是一个自带密钥模式的插件，别人安装后需要填写自己的 API Key 才能使用。</p>
          <p id="status" class="status">读取设置中...</p>
        </form>
      </section>
    </main>

    <script src="./options.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图透镜 Image Lens 设置</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero glass">
        <div>
          <p class="eyebrow">图透镜 Image Lens</p>
          <h1>填写模型配置后即可开始使用</h1>
          <p class="subtitle">API Key 只保存在当前浏览器本地。准备公开分发时，建议优先使用代理模式。</p>
        </div>
      </section>

      <section class="grid">
        <form id="settings-form" class="glass card">
          <div class="section-head">
            <h2>基础设置</h2>
            <p>当前默认接入 Gemini，后续也可以扩展到其他兼容接口。</p>
          </div>

          <label class="field">
            <span>连接方式</span>
            <select name="apiMode">
              <option value="direct">直连 API</option>
              <option value="proxy">代理模式</option>
            </select>
          </label>

          <label class="field">
            <span>API Key</span>
            <input name="geminiApiKey" type="password" placeholder="AIza..." autocomplete="off" />
            <small>只保存在本地 `chrome.storage.local`，不会写入代码仓库。</small>
          </label>

          <label class="field">
            <span>提示词模型</span>
            <input name="geminiTextModel" type="text" placeholder="gemini-2.5-flash" />
          </label>

          <label class="field">
            <span>生图模型</span>
            <input name="geminiImageModel" type="text" placeholder="gemini-3.1-flash-image-preview" />
            <small>不同账号、地区或套餐的可用模型可能不同。</small>
          </label>

          <div class="proxy-fields" id="proxy-fields">
            <label class="field">
              <span>代理地址</span>
              <input name="customProxyUrl" type="url" placeholder="https://your-api.example.com/" />
            </label>

            <label class="field">
              <span>代理 Token</span>
              <input name="customProxyToken" type="password" placeholder="可选" autocomplete="off" />
            </label>
          </div>

          <details class="advanced glass-subtle">
            <summary>高级设置</summary>

            <div class="advanced-body">
              <label class="field toggle">
                <span>打开面板后自动识别</span>
                <input name="autoAnalyze" form="settings-form" type="checkbox" />
              </label>

              <label class="field">
                <span>默认长宽比</span>
                <select name="aspectRatio" form="settings-form">
                  <option value="1:1">1:1</option>
                  <option value="16:9">16:9</option>
                  <option value="9:16">9:16</option>
                  <option value="4:3">4:3</option>
                  <option value="3:4">3:4</option>
                </select>
              </label>

              <label class="field">
                <span>默认出图张数</span>
                <select name="imageCount" form="settings-form">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </label>
            </div>
          </details>

          <div class="actions">
            <button class="primary" type="submit">保存设置</button>
            <button id="open-doc" type="button">查看文档</button>
          </div>
          <p class="note">提示：如果准备公开给别人安装使用，建议使用代理模式，不要直接共享正式 API Key。</p>
          <p id="status" class="status">读取设置中...</p>
        </form>
      </section>
    </main>

    <script src="./options.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Lens Viewer</title>
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <main class="page">
      <section class="glass hero">
        <div class="hero-copy">
          <p id="viewer-eyebrow" class="eyebrow">Image Lens</p>
          <h1 id="viewer-heading">Prompt</h1>
          <p id="prompt" class="prompt">Loading...</p>
        </div>
        <div class="hero-actions">
          <button id="copy-prompt" type="button">Copy Prompt</button>
          <button id="download-images" type="button">Download Images</button>
        </div>
      </section>
      <section id="gallery" class="gallery"></section>
    </main>

    <script src="./i18n.js"></script>
    <script src="./viewer.js"></script>
  </body>
</html>
